<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>五十音練習</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f7f7f5;
      --surface: #ffffff;
      --border: #e0e0de;
      --text: #1a1a18;
      --muted: #888885;
      --accent: #3d6fff;
      --correct: #22c55e;
      --wrong: #ef4444;
      --tag-bg: #f0f0ee;
      --tag-active: #3d6fff;
      --tag-active-text: #fff;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 480px;
      padding: 28px 20px 0;
    }
    header h1 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: .05em;
    }

    #settings {
      width: 100%;
      max-width: 480px;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .row { display: flex; gap: 8px; flex-wrap: wrap; }

    .tag {
      cursor: pointer;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: var(--tag-bg);
      font-size: .85rem;
      font-weight: 500;
      color: var(--text);
      transition: all .15s;
      user-select: none;
    }
    .tag.active {
      background: var(--tag-active);
      border-color: var(--tag-active);
      color: var(--tag-active-text);
    }
    .tag:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

    #start-btn {
      align-self: flex-end;
      padding: 8px 22px;
      border-radius: 20px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: .9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
    }
    #start-btn:hover { opacity: .85; }

    #quiz {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 480px;
      padding: 12px 20px 40px;
      gap: 16px;
    }

    #progress-wrap {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    #progress-bar-bg {
      flex: 1;
      height: 4px;
      border-radius: 4px;
      background: var(--border);
      overflow: hidden;
    }
    #progress-bar {
      height: 100%;
      border-radius: 4px;
      background: var(--accent);
      transition: width .3s;
    }
    #progress-text {
      font-size: .78rem;
      color: var(--muted);
      white-space: nowrap;
      min-width: 44px;
      text-align: right;
    }

    #score-wrap {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      gap: 16px;
      font-size: .82rem;
      color: var(--muted);
    }
    #score-correct { color: var(--correct); font-weight: 600; }
    #score-wrong   { color: var(--wrong);   font-weight: 600; }

    #card {
      width: 100%;
      background: var(--surface);
      border-radius: 16px;
      border: 1.5px solid var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 24px 28px;
      gap: 28px;
    }

    #kana {
      font-size: 5rem;
      line-height: 1;
      font-weight: 300;
      letter-spacing: .02em;
      user-select: none;
    }

    #input-wrap { width: 100%; max-width: 240px; position: relative; }

    #answer {
      width: 100%;
      padding: 12px 16px;
      font-size: 1.1rem;
      border: 2px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
      color: var(--text);
      text-align: center;
      outline: none;
      transition: border-color .2s, background .2s;
      letter-spacing: .08em;
    }
    #answer:focus  { border-color: var(--accent); }
    #answer.correct { border-color: var(--correct); background: #f0fdf4; }
    #answer.wrong   { border-color: var(--wrong);   background: #fff5f5; }

    #hint {
      margin-top: 8px;
      font-size: .82rem;
      text-align: center;
      min-height: 18px;
      color: var(--muted);
    }
    #hint.correct { color: var(--correct); }
    #hint.wrong   { color: var(--wrong); }

    #next-btn {
      display: none;
      padding: 8px 24px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-size: .85rem;
      cursor: pointer;
      transition: all .15s;
    }
    #next-btn:hover { border-color: var(--accent); color: var(--accent); }
    #next-btn.visible { display: inline-block; }

    #result {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 480px;
      padding: 40px 20px;
      gap: 24px;
    }
    #result h2 { font-size: 1.4rem; font-weight: 700; }
    #result-stats { display: flex; gap: 32px; font-size: 1rem; }
    .stat { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .stat span:first-child { font-size: 2rem; font-weight: 700; }
    .stat span:last-child  { font-size: .78rem; color: var(--muted); }
    .stat.c span:first-child { color: var(--correct); }
    .stat.w span:first-child { color: var(--wrong); }

    #wrong-list-wrap { width: 100%; }
    #wrong-list-wrap h3 { font-size: .85rem; color: var(--muted); margin-bottom: 10px; }
    #wrong-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .wrong-item {
      padding: 6px 12px;
      border-radius: 8px;
      background: #fff5f5;
      border: 1px solid #fecaca;
      font-size: .9rem;
      color: var(--wrong);
    }

    #retry-btn {
      padding: 10px 28px;
      border-radius: 20px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: .95rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
    }
    #retry-btn:hover { opacity: .85; }

    @media (max-width: 400px) { #kana { font-size: 4rem; } }
  </style>
</head>
<body>

<header><h1>五十音練習</h1></header>

<section id="settings">
  <div class="row">
    <span class="tag active" data-group="script" data-value="hira">平假名</span>
    <span class="tag"        data-group="script" data-value="kata">片假名</span>
  </div>
  <div class="row">
    <span class="tag" data-group="opt" data-value="daku">濁音</span>
    <span class="tag" data-group="opt" data-value="handaku">半濁音</span>
    <span class="tag" data-group="opt" data-value="you">拗音</span>
  </div>
  <button id="start-btn">開始練習</button>
</section>

<section id="quiz">
  <div id="progress-wrap">
    <div id="progress-bar-bg"><div id="progress-bar" style="width:0%"></div></div>
    <span id="progress-text">0 / 100</span>
  </div>
  <div id="score-wrap">
    <span>✓ <span id="score-correct">0</span></span>
    <span>✗ <span id="score-wrong">0</span></span>
  </div>
  <div id="card">
    <div id="kana">あ</div>
    <div id="input-wrap">
      <input id="answer" type="text" autocomplete="off" autocorrect="off"
             autocapitalize="off" spellcheck="false" placeholder="羅馬拼音" />
      <div id="hint"></div>
    </div>
  </div>
  <button id="next-btn">下一題 →</button>
</section>

<section id="result">
  <h2>練習完成！</h2>
  <div id="result-stats">
    <div class="stat c"><span id="r-correct">0</span><span>正確</span></div>
    <div class="stat w"><span id="r-wrong">0</span><span>錯誤</span></div>
    <div class="stat"><span id="r-acc">0%</span><span>正確率</span></div>
  </div>
  <div id="wrong-list-wrap">
    <h3>答錯的字</h3>
    <div id="wrong-list"></div>
  </div>
  <button id="retry-btn">再練一次</button>
</section>

<script>
// ── DATA ──────────────────────────────────────
const HIRA_BASIC = [
  {k:'あ',r:['a']},  {k:'い',r:['i']},  {k:'う',r:['u']},  {k:'え',r:['e']},  {k:'お',r:['o']},
  {k:'か',r:['ka']}, {k:'き',r:['ki']}, {k:'く',r:['ku']}, {k:'け',r:['ke']}, {k:'こ',r:['ko']},
  {k:'さ',r:['sa']}, {k:'し',r:['shi','si']}, {k:'す',r:['su']}, {k:'せ',r:['se']}, {k:'そ',r:['so']},
  {k:'た',r:['ta']}, {k:'ち',r:['chi','ti']}, {k:'つ',r:['tsu','tu']}, {k:'て',r:['te']}, {k:'と',r:['to']},
  {k:'な',r:['na']}, {k:'に',r:['ni']}, {k:'ぬ',r:['nu']}, {k:'ね',r:['ne']}, {k:'の',r:['no']},
  {k:'は',r:['ha']}, {k:'ひ',r:['hi']}, {k:'ふ',r:['fu','hu']}, {k:'へ',r:['he']}, {k:'ほ',r:['ho']},
  {k:'ま',r:['ma']}, {k:'み',r:['mi']}, {k:'む',r:['mu']}, {k:'め',r:['me']}, {k:'も',r:['mo']},
  {k:'や',r:['ya']}, {k:'ゆ',r:['yu']}, {k:'よ',r:['yo']},
  {k:'ら',r:['ra']}, {k:'り',r:['ri']}, {k:'る',r:['ru']}, {k:'れ',r:['re']}, {k:'ろ',r:['ro']},
  {k:'わ',r:['wa']}, {k:'を',r:['wo','o']}, {k:'ん',r:['n','nn']},
];

const HIRA_DAKU = [
  {k:'が',r:['ga']}, {k:'ぎ',r:['gi']}, {k:'ぐ',r:['gu']}, {k:'げ',r:['ge']}, {k:'ご',r:['go']},
  {k:'ざ',r:['za']}, {k:'じ',r:['ji','zi']}, {k:'ず',r:['zu']}, {k:'ぜ',r:['ze']}, {k:'ぞ',r:['zo']},
  {k:'だ',r:['da']}, {k:'ぢ',r:['ji','di','zi']}, {k:'づ',r:['zu','du']}, {k:'で',r:['de']}, {k:'ど',r:['do']},
  {k:'ば',r:['ba']}, {k:'び',r:['bi']}, {k:'ぶ',r:['bu']}, {k:'べ',r:['be']}, {k:'ぼ',r:['bo']},
];

const HIRA_HANDAKU = [
  {k:'ぱ',r:['pa']}, {k:'ぴ',r:['pi']}, {k:'ぷ',r:['pu']}, {k:'ぺ',r:['pe']}, {k:'ぽ',r:['po']},
];

const HIRA_YOU_BASIC = [
  {k:'きゃ',r:['kya']}, {k:'きゅ',r:['kyu']}, {k:'きょ',r:['kyo']},
  {k:'しゃ',r:['sha','sya']}, {k:'しゅ',r:['shu','syu']}, {k:'しょ',r:['sho','syo']},
  {k:'ちゃ',r:['cha','tya']}, {k:'ちゅ',r:['chu','tyu']}, {k:'ちょ',r:['cho','tyo']},
  {k:'にゃ',r:['nya']}, {k:'にゅ',r:['nyu']}, {k:'にょ',r:['nyo']},
  {k:'ひゃ',r:['hya']}, {k:'ひゅ',r:['hyu']}, {k:'ひょ',r:['hyo']},
  {k:'みゃ',r:['mya']}, {k:'みゅ',r:['myu']}, {k:'みょ',r:['myo']},
  {k:'りゃ',r:['rya']}, {k:'りゅ',r:['ryu']}, {k:'りょ',r:['ryo']},
];
const HIRA_YOU_DAKU = [
  {k:'ぎゃ',r:['gya']}, {k:'ぎゅ',r:['gyu']}, {k:'ぎょ',r:['gyo']},
  {k:'じゃ',r:['ja','jya','zya']}, {k:'じゅ',r:['ju','jyu','zyu']}, {k:'じょ',r:['jo','jyo','zyo']},
  {k:'びゃ',r:['bya']}, {k:'びゅ',r:['byu']}, {k:'びょ',r:['byo']},
];
const HIRA_YOU_HANDAKU = [
  {k:'ぴゃ',r:['pya']}, {k:'ぴゅ',r:['pyu']}, {k:'ぴょ',r:['pyo']},
];

function toKata(str) {
  return str.replace(/[\u3041-\u3096]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
}

const KATA_BASIC      = HIRA_BASIC.map(x=>({k:toKata(x.k),r:x.r}));
const KATA_DAKU       = HIRA_DAKU.map(x=>({k:toKata(x.k),r:x.r}));
const KATA_HANDAKU    = HIRA_HANDAKU.map(x=>({k:toKata(x.k),r:x.r}));
const KATA_YOU_BASIC  = HIRA_YOU_BASIC.map(x=>({k:toKata(x.k),r:x.r}));
const KATA_YOU_DAKU   = HIRA_YOU_DAKU.map(x=>({k:toKata(x.k),r:x.r}));
const KATA_YOU_HANDAKU= HIRA_YOU_HANDAKU.map(x=>({k:toKata(x.k),r:x.r}));

// ── STATE ─────────────────────────────────────
const TOTAL = 100;
let questions=[], current=0, scoreC=0, scoreW=0;
let answered=false, waitingNext=false;
let wrongSet = new Map();

// ── SETTINGS UI ───────────────────────────────
const settings = { script:'hira', daku:false, handaku:false, you:false };

document.querySelectorAll('.tag').forEach(t => {
  t.addEventListener('click', () => {
    if (t.dataset.group === 'script') {
      document.querySelectorAll('[data-group="script"]').forEach(x=>x.classList.remove('active'));
      t.classList.add('active');
      settings.script = t.dataset.value;
    } else {
      t.classList.toggle('active');
      settings[t.dataset.value] = t.classList.contains('active');
    }
  });
});

// ── HELPERS ───────────────────────────────────
function shuffle(arr) {
  for (let i=arr.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function buildPool() {
  const isH = settings.script === 'hira';
  let pool = [...(isH ? HIRA_BASIC : KATA_BASIC)];
  if (settings.daku)    pool = pool.concat(isH ? HIRA_DAKU    : KATA_DAKU);
  if (settings.handaku) pool = pool.concat(isH ? HIRA_HANDAKU : KATA_HANDAKU);
  if (settings.you) {
    pool = pool.concat(isH ? HIRA_YOU_BASIC : KATA_YOU_BASIC);
    if (settings.daku)    pool = pool.concat(isH ? HIRA_YOU_DAKU    : KATA_YOU_DAKU);
    if (settings.handaku) pool = pool.concat(isH ? HIRA_YOU_HANDAKU : KATA_YOU_HANDAKU);
  }
  return pool;
}

function buildQuestions(pool) {
  if (pool.length >= TOTAL) {
    return shuffle([...pool]).slice(0, TOTAL);
  }
  const base  = shuffle([...pool]);
  const extra = Math.floor((TOTAL - pool.length) / pool.length);
  const rem   = (TOTAL - pool.length) % pool.length;
  let q = [...base];
  for (let i=0; i<extra; i++) q = q.concat(shuffle([...pool]));
  q = q.concat(shuffle([...pool]).slice(0, rem));
  return shuffle(q);
}

// ── DOM REFS ──────────────────────────────────
const settingsEl = document.getElementById('settings');
const quizEl     = document.getElementById('quiz');
const resultEl   = document.getElementById('result');
const kanaEl     = document.getElementById('kana');
const answerEl   = document.getElementById('answer');
const hintEl     = document.getElementById('hint');
const nextBtn    = document.getElementById('next-btn');
const pbEl       = document.getElementById('progress-bar');
const ptEl       = document.getElementById('progress-text');
const scC        = document.getElementById('score-correct');
const scW        = document.getElementById('score-wrong');

// ── QUIZ ──────────────────────────────────────
document.getElementById('start-btn').addEventListener('click', startQuiz);

function startQuiz() {
  const pool = buildPool();
  questions = buildQuestions(pool);
  current=0; scoreC=0; scoreW=0; wrongSet=new Map();
  settingsEl.style.display = 'none';
  resultEl.style.display   = 'none';
  quizEl.style.display     = 'flex';
  updateScore();
  showQuestion();
}

function showQuestion() {
  answered=false; waitingNext=false;
  const q = questions[current];
  kanaEl.textContent = q.k;
  answerEl.value=''; answerEl.className='';
  hintEl.textContent=''; hintEl.className='';
  nextBtn.classList.remove('visible');
  updateProgress();
  answerEl.focus();
}

function updateProgress() {
  pbEl.style.width = (current/TOTAL*100)+'%';
  ptEl.textContent = current+' / '+TOTAL;
}
function updateScore() {
  scC.textContent=scoreC; scW.textContent=scoreW;
}

answerEl.addEventListener('input', () => {
  if (answered) return;
  answerEl.className=''; hintEl.textContent=''; hintEl.className='';
});

answerEl.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  if (waitingNext) { advance(); return; }
  if (!answered)   { checkAnswer(); }
});

nextBtn.addEventListener('click', advance);

function checkAnswer() {
  const raw = answerEl.value.trim().toLowerCase();
  if (!raw) return;
  const q = questions[current];
  const ok = q.r.includes(raw);
  answered = true;

  if (ok) {
    answerEl.className='correct'; hintEl.textContent='✓ 正確！'; hintEl.className='correct';
    scoreC++; updateScore();
    setTimeout(()=>{ if(answered) advance(); }, 600);
  } else {
    answerEl.className='wrong';
    hintEl.textContent='✗ 正確答案：'+q.r[0]; hintEl.className='wrong';
    scoreW++; updateScore();
    if (!wrongSet.has(q.k)) wrongSet.set(q.k, q.r[0]);
    waitingNext=true; nextBtn.classList.add('visible');
  }
}

function advance() {
  current++;
  if (current >= TOTAL) showResult(); else showQuestion();
}

// ── RESULT ────────────────────────────────────
function showResult() {
  quizEl.style.display='none'; resultEl.style.display='flex';
  document.getElementById('r-correct').textContent=scoreC;
  document.getElementById('r-wrong').textContent=scoreW;
  document.getElementById('r-acc').textContent=Math.round(scoreC/TOTAL*100)+'%';
  const wl=document.getElementById('wrong-list');
  wl.innerHTML='';
  if (wrongSet.size===0) {
    wl.innerHTML='<span style="color:var(--correct);font-size:.9rem">全部答對！🎉</span>';
  } else {
    wrongSet.forEach((romaji,kana)=>{
      const el=document.createElement('span');
      el.className='wrong-item'; el.textContent=kana+' → '+romaji;
      wl.appendChild(el);
    });
  }
}

document.getElementById('retry-btn').addEventListener('click', ()=>{
  resultEl.style.display='none'; settingsEl.style.display='flex';
});
</script>
</body>
</html>
