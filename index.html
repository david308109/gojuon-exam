<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>五十音練習</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f8f8f6;
      --surface: #fff;
      --border: #e2e2e0;
      --text: #1a1a18;
      --muted: #909090;
      --accent: #3d6fff;
      --correct: #16a34a;
      --correct-bg: #f0fdf4;
      --correct-border: #86efac;
      --wrong: #dc2626;
      --wrong-bg: #fff5f5;
      --wrong-border: #fca5a5;
      --active-bg: #eff4ff;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      min-height: 100vh; display: flex;
      flex-direction: column; align-items: center;
    }

    /* ── Settings ── */
    #settings {
      width: 100%; max-width: 540px;
      padding: 32px 20px 20px;
      display: flex; flex-direction: column; gap: 14px;
    }
    #settings h1 { font-size: 1.15rem; font-weight: 600; color: var(--muted); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .tag {
      cursor: pointer; padding: 6px 16px; border-radius: 20px;
      border: 1.5px solid var(--border); background: #efefed;
      font-size: .85rem; font-weight: 500; user-select: none; transition: all .15s;
    }
    .tag.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .tag:hover:not(.active) { border-color: var(--accent); color: var(--accent); }
    #start-btn {
      align-self: flex-end; padding: 9px 24px; border-radius: 20px;
      border: none; background: var(--accent); color: #fff;
      font-size: .9rem; font-weight: 600; cursor: pointer;
    }
    #start-btn:hover { opacity: .85; }

    /* ── Quiz ── */
    #quiz { display: none; width: 100%; flex-direction: column; align-items: center; }

    #topbar {
      position: sticky; top: 0; z-index: 10;
      width: 100%; background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
    }
    #topbar-inner {
      width: 100%; max-width: 540px; margin: 0 auto;
      display: flex; align-items: center; gap: 12px;
    }
    #pb-bg { flex: 1; height: 5px; border-radius: 4px; background: var(--border); overflow: hidden; }
    #pb { height: 100%; border-radius: 4px; background: var(--accent); transition: width .2s; }
    #prog-txt { font-size: .78rem; color: var(--muted); white-space: nowrap; }
    .sc-c { font-size: .82rem; font-weight: 700; color: var(--correct); }
    .sc-w { font-size: .82rem; font-weight: 700; color: var(--wrong); }

    #qlist {
      width: 100%; max-width: 540px;
      padding: 10px 20px 60px;
      display: flex; flex-direction: column; gap: 4px;
    }

    .qrow {
      display: flex; align-items: center; gap: 12px;
      padding: 6px 10px; border-radius: 10px;
      border: 1.5px solid transparent; transition: background .15s;
    }
    .qrow.active-row { background: var(--active-bg); border-color: #c7d9ff; }
    .qrow.done-correct { opacity: .4; }
    .qrow.done-wrong { opacity: .8; }

    .qnum { font-size: .7rem; color: var(--muted); min-width: 24px; text-align: right; flex-shrink: 0; }
    .qkana { font-size: 2rem; line-height: 1; min-width: 54px; text-align: center; flex-shrink: 0; user-select: none; }
    .qinput {
      width: 96px; padding: 5px 8px;
      font-size: .92rem; border: 2px solid var(--border);
      border-radius: 8px; background: var(--bg); color: var(--text);
      text-align: center; outline: none; letter-spacing: .06em;
      transition: border-color .1s, background .1s;
    }
    .qinput:focus { border-color: var(--accent); background: var(--surface); }
    .qinput.correct { border-color: var(--correct-border); background: var(--correct-bg); color: var(--correct); font-weight: 600; }
    .qinput.wrong   { border-color: var(--wrong-border);   background: var(--wrong-bg);   color: var(--wrong); }
    .qhint { font-size: .75rem; min-width: 48px; }
    .qhint.correct { color: var(--correct); }
    .qhint.wrong   { color: var(--wrong); }

    /* ── Result ── */
    #result {
      display: none; flex-direction: column; align-items: center;
      width: 100%; max-width: 540px;
      padding: 40px 20px; gap: 24px;
    }
    #result h2 { font-size: 1.5rem; font-weight: 700; }
    #res-stats { display: flex; gap: 32px; }
    .rstat { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .rstat span:first-child { font-size: 2.2rem; font-weight: 700; }
    .rstat span:last-child  { font-size: .78rem; color: var(--muted); }
    .rstat.c span:first-child { color: var(--correct); }
    .rstat.w span:first-child { color: var(--wrong); }
    #wrong-list-wrap { width: 100%; }
    #wrong-list-wrap h3 { font-size: .85rem; color: var(--muted); margin-bottom: 10px; }
    #wrong-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .wi {
      padding: 5px 12px; border-radius: 8px;
      background: var(--wrong-bg); border: 1px solid var(--wrong-border);
      font-size: .88rem; color: var(--wrong);
    }
    #retry-btn {
      padding: 10px 28px; border-radius: 20px; border: none;
      background: var(--accent); color: #fff;
      font-size: .95rem; font-weight: 600; cursor: pointer;
    }
    #retry-btn:hover { opacity: .85; }
  </style>
</head>
<body>

<section id="settings">
  <h1>五十音練習</h1>
  <div class="row">
    <span class="tag active" data-group="script" data-value="hira">平假名</span>
    <span class="tag"        data-group="script" data-value="kata">片假名</span>
  </div>
  <div class="row">
    <span class="tag" data-group="opt" data-value="daku">濁音</span>
    <span class="tag" data-group="opt" data-value="handaku">半濁音</span>
    <span class="tag" data-group="opt" data-value="you">拗音</span>
  </div>
  <button id="start-btn">開始練習</button>
</section>

<section id="quiz">
  <div id="topbar">
    <div id="topbar-inner">
      <div id="pb-bg"><div id="pb" style="width:0%"></div></div>
      <span id="prog-txt">0 / 100</span>
      <span class="sc-c">✓ <span id="sc-c">0</span></span>
      <span class="sc-w">✗ <span id="sc-w">0</span></span>
    </div>
  </div>
  <div id="qlist"></div>
</section>

<section id="result">
  <h2>練習完成！</h2>
  <div id="res-stats">
    <div class="rstat c"><span id="r-c">0</span><span>正確</span></div>
    <div class="rstat w"><span id="r-w">0</span><span>錯誤</span></div>
    <div class="rstat">  <span id="r-a">0%</span><span>正確率</span></div>
  </div>
  <div id="wrong-list-wrap">
    <h3>答錯的字</h3>
    <div id="wrong-list"></div>
  </div>
  <button id="retry-btn">再練一次</button>
</section>

<script>
// ── DATA ─────────────────────────────────────
const HIRA_BASIC = [
  {k:'あ',r:['a']},  {k:'い',r:['i']},  {k:'う',r:['u']},  {k:'え',r:['e']},  {k:'お',r:['o']},
  {k:'か',r:['ka']}, {k:'き',r:['ki']}, {k:'く',r:['ku']}, {k:'け',r:['ke']}, {k:'こ',r:['ko']},
  {k:'さ',r:['sa']}, {k:'し',r:['shi','si']}, {k:'す',r:['su']}, {k:'せ',r:['se']}, {k:'そ',r:['so']},
  {k:'た',r:['ta']}, {k:'ち',r:['chi','ti']}, {k:'つ',r:['tsu','tu']}, {k:'て',r:['te']}, {k:'と',r:['to']},
  {k:'な',r:['na']}, {k:'に',r:['ni']}, {k:'ぬ',r:['nu']}, {k:'ね',r:['ne']}, {k:'の',r:['no']},
  {k:'は',r:['ha']}, {k:'ひ',r:['hi']}, {k:'ふ',r:['fu','hu']}, {k:'へ',r:['he']}, {k:'ほ',r:['ho']},
  {k:'ま',r:['ma']}, {k:'み',r:['mi']}, {k:'む',r:['mu']}, {k:'め',r:['me']}, {k:'も',r:['mo']},
  {k:'や',r:['ya']}, {k:'ゆ',r:['yu']}, {k:'よ',r:['yo']},
  {k:'ら',r:['ra']}, {k:'り',r:['ri']}, {k:'る',r:['ru']}, {k:'れ',r:['re']}, {k:'ろ',r:['ro']},
  {k:'わ',r:['wa']}, {k:'を',r:['wo','o']}, {k:'ん',r:['n','nn']},
];
const HIRA_DAKU = [
  {k:'が',r:['ga']}, {k:'ぎ',r:['gi']}, {k:'ぐ',r:['gu']}, {k:'げ',r:['ge']}, {k:'ご',r:['go']},
  {k:'ざ',r:['za']}, {k:'じ',r:['ji','zi']}, {k:'ず',r:['zu']}, {k:'ぜ',r:['ze']}, {k:'ぞ',r:['zo']},
  {k:'だ',r:['da']}, {k:'ぢ',r:['ji','di','zi']}, {k:'づ',r:['zu','du']}, {k:'で',r:['de']}, {k:'ど',r:['do']},
  {k:'ば',r:['ba']}, {k:'び',r:['bi']}, {k:'ぶ',r:['bu']}, {k:'べ',r:['be']}, {k:'ぼ',r:['bo']},
];
const HIRA_HANDAKU = [
  {k:'ぱ',r:['pa']}, {k:'ぴ',r:['pi']}, {k:'ぷ',r:['pu']}, {k:'ぺ',r:['pe']}, {k:'ぽ',r:['po']},
];
const HIRA_YOU_BASIC = [
  {k:'きゃ',r:['kya']}, {k:'きゅ',r:['kyu']}, {k:'きょ',r:['kyo']},
  {k:'しゃ',r:['sha','sya']}, {k:'しゅ',r:['shu','syu']}, {k:'しょ',r:['sho','syo']},
  {k:'ちゃ',r:['cha','tya']}, {k:'ちゅ',r:['chu','tyu']}, {k:'ちょ',r:['cho','tyo']},
  {k:'にゃ',r:['nya']}, {k:'にゅ',r:['nyu']}, {k:'にょ',r:['nyo']},
  {k:'ひゃ',r:['hya']}, {k:'ひゅ',r:['hyu']}, {k:'ひょ',r:['hyo']},
  {k:'みゃ',r:['mya']}, {k:'みゅ',r:['myu']}, {k:'みょ',r:['myo']},
  {k:'りゃ',r:['rya']}, {k:'りゅ',r:['ryu']}, {k:'りょ',r:['ryo']},
];
const HIRA_YOU_DAKU = [
  {k:'ぎゃ',r:['gya']}, {k:'ぎゅ',r:['gyu']}, {k:'ぎょ',r:['gyo']},
  {k:'じゃ',r:['ja','jya','zya']}, {k:'じゅ',r:['ju','jyu','zyu']}, {k:'じょ',r:['jo','jyo','zyo']},
  {k:'びゃ',r:['bya']}, {k:'びゅ',r:['byu']}, {k:'びょ',r:['byo']},
];
const HIRA_YOU_HANDAKU = [
  {k:'ぴゃ',r:['pya']}, {k:'ぴゅ',r:['pyu']}, {k:'ぴょ',r:['pyo']},
];

function toKata(s){ return s.replace(/[\u3041-\u3096]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60)); }
const KATA_BASIC       = HIRA_BASIC.map(x=>({k:toKata(x.k),r:x.r}));
const KATA_DAKU        = HIRA_DAKU.map(x=>({k:toKata(x.k),r:x.r}));
const KATA_HANDAKU     = HIRA_HANDAKU.map(x=>({k:toKata(x.k),r:x.r}));
const KATA_YOU_BASIC   = HIRA_YOU_BASIC.map(x=>({k:toKata(x.k),r:x.r}));
const KATA_YOU_DAKU    = HIRA_YOU_DAKU.map(x=>({k:toKata(x.k),r:x.r}));
const KATA_YOU_HANDAKU = HIRA_YOU_HANDAKU.map(x=>({k:toKata(x.k),r:x.r}));

// ── HELPERS ──────────────────────────────────
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
const TOTAL = 100;
const cfg = {script:'hira',daku:false,handaku:false,you:false};

function buildPool(){
  const H = cfg.script==='hira';
  let p = [...(H?HIRA_BASIC:KATA_BASIC)];
  if(cfg.daku)    p=p.concat(H?HIRA_DAKU:KATA_DAKU);
  if(cfg.handaku) p=p.concat(H?HIRA_HANDAKU:KATA_HANDAKU);
  if(cfg.you){
    p=p.concat(H?HIRA_YOU_BASIC:KATA_YOU_BASIC);
    if(cfg.daku)    p=p.concat(H?HIRA_YOU_DAKU:KATA_YOU_DAKU);
    if(cfg.handaku) p=p.concat(H?HIRA_YOU_HANDAKU:KATA_YOU_HANDAKU);
  }
  return p;
}

function buildQuestions(pool){
  if(pool.length>=TOTAL) return shuffle([...pool]).slice(0,TOTAL);
  const extra = Math.floor((TOTAL-pool.length)/pool.length);
  const rem   = (TOTAL-pool.length)%pool.length;
  let q = shuffle([...pool]);
  for(let i=0;i<extra;i++) q=q.concat(shuffle([...pool]));
  q=q.concat(shuffle([...pool]).slice(0,rem));
  return shuffle(q);
}

// ── SETTINGS ─────────────────────────────────
document.querySelectorAll('.tag').forEach(t=>{
  t.addEventListener('click',()=>{
    if(t.dataset.group==='script'){
      document.querySelectorAll('[data-group="script"]').forEach(x=>x.classList.remove('active'));
      t.classList.add('active'); cfg.script=t.dataset.value;
    } else {
      t.classList.toggle('active'); cfg[t.dataset.value]=t.classList.contains('active');
    }
  });
});

// ── STATE ────────────────────────────────────
let questions=[], done=0, scoreC=0, wrongMap=new Map();
let inputs=[], hints=[], rows=[], wasWrong=[];
let curIdx=0; // currently active input index

const settEl = document.getElementById('settings');
const quizEl = document.getElementById('quiz');
const resEl  = document.getElementById('result');
const pbEl   = document.getElementById('pb');
const ptEl   = document.getElementById('prog-txt');
const scCEl  = document.getElementById('sc-c');
const scWEl  = document.getElementById('sc-w');
const qlist  = document.getElementById('qlist');

document.getElementById('start-btn').addEventListener('click', startQuiz);

function startQuiz(){
  const pool = buildPool();
  questions = buildQuestions(pool);
  done=0; scoreC=0; wrongMap=new Map(); curIdx=0;
  inputs=[]; hints=[]; rows=[]; wasWrong=[];
  qlist.innerHTML='';

  questions.forEach((q,i)=>{
    const row = document.createElement('div');
    row.className = 'qrow' + (i===0?' active-row':'');

    const num = document.createElement('span');
    num.className='qnum'; num.textContent=i+1;

    const kana = document.createElement('span');
    kana.className='qkana'; kana.textContent=q.k;

    const inp = document.createElement('input');
    inp.type='text'; inp.className='qinput';
    inp.autocomplete='off'; inp.autocorrect='off';
    inp.autocapitalize='off'; inp.spellcheck=false;
    inp.placeholder='?';
    inp.tabIndex = i+1;
    inp.readOnly = (i!==0);   // only first row editable at start

    const hint = document.createElement('span');
    hint.className='qhint';

    row.appendChild(num); row.appendChild(kana);
    row.appendChild(inp); row.appendChild(hint);
    qlist.appendChild(row);

    rows.push(row); inputs.push(inp); hints.push(hint); wasWrong.push(false);

    inp.addEventListener('input', ()=>onType(i));
    inp.addEventListener('focus', ()=>setActive(i));
  });

  updateTop();
  settEl.style.display='none';
  quizEl.style.display='flex';
  inputs[0].focus();
  inputs[0].scrollIntoView({behavior:'smooth',block:'center'});
}

// ── REAL-TIME CHECK ──────────────────────────
function onType(i){
  if(inputs[i].readOnly && i!==curIdx) return;
  const val = inputs[i].value.toLowerCase().trim();
  const q   = questions[i];

  if(!val){
    inputs[i].className='qinput';
    hints[i].textContent=''; hints[i].className='qhint';
    return;
  }

  // Exact match → CORRECT, advance immediately
  if(q.r.includes(val)){
    markCorrect(i);
    return;
  }

  // Still a valid prefix of some answer → neutral
  if(q.r.some(a=>a.startsWith(val))){
    inputs[i].className='qinput';
    hints[i].textContent=''; hints[i].className='qhint';
    return;
  }

  // Cannot be correct → WRONG (red only, user keeps trying)
  inputs[i].className='qinput wrong';
  hints[i].textContent=''; hints[i].className='qhint';
  wasWrong[i]=true;
}

function markCorrect(i){
  const inp  = inputs[i];
  const hint = hints[i];
  const row  = rows[i];

  inp.className='qinput correct'; inp.readOnly=true;
  hint.textContent='✓'; hint.className='qhint correct';
  row.classList.remove('active-row'); row.classList.add('done-correct');

  // if they ever got it wrong before, record it
  if(wasWrong[i] && !wrongMap.has(questions[i].k))
    wrongMap.set(questions[i].k, questions[i].r[0]);

  scoreC++; done++;
  updateTop();

  if(done===TOTAL){ setTimeout(showResult,300); return; }
  advanceTo(findNext(i));
}

function findNext(from){
  for(let j=from+1;j<TOTAL;j++) if(!inputs[j].readOnly) return j;
  for(let j=0;j<from;j++)        if(!inputs[j].readOnly) return j;
  return -1;
}

function advanceTo(i){
  if(i===-1) return;
  curIdx=i;
  rows[i].classList.add('active-row');
  inputs[i].readOnly=false;
  inputs[i].value='';
  inputs[i].className='qinput';
  hints[i].textContent=''; hints[i].className='qhint';
  inputs[i].focus();
  rows[i].scrollIntoView({behavior:'smooth',block:'center'});
}

function setActive(i){
  if(inputs[i].readOnly) return;
  rows[curIdx].classList.remove('active-row');
  curIdx=i;
  rows[i].classList.add('active-row');
}



function updateTop(){
  const pct=done/TOTAL*100;
  pbEl.style.width=pct+'%';
  ptEl.textContent=done+' / '+TOTAL;
  scCEl.textContent=scoreC;
  scWEl.textContent=wrongMap.size;
}

// ── RESULT ───────────────────────────────────
function showResult(){
  quizEl.style.display='none'; resEl.style.display='flex';
  document.getElementById('r-c').textContent=scoreC;
  document.getElementById('r-w').textContent=wrongMap.size;
  document.getElementById('r-a').textContent=Math.round(scoreC/TOTAL*100)+'%';
  const wl=document.getElementById('wrong-list');
  wl.innerHTML='';
  if(!wrongMap.size){
    wl.innerHTML='<span style="color:var(--correct)">全部答對！🎉</span>';
  } else {
    wrongMap.forEach((r,k)=>{
      const el=document.createElement('span');
      el.className='wi'; el.textContent=k+' \u2192 '+r;
      wl.appendChild(el);
    });
  }
}

document.getElementById('retry-btn').addEventListener('click',()=>{
  resEl.style.display='none'; settEl.style.display='flex';
});
</script>
</body>
</html>
