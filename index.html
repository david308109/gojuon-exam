<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>五十音練習</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f8f8f6;
      --surface: #fff;
      --border: #e2e2e0;
      --text: #1a1a18;
      --muted: #909090;
      --accent: #3d6fff;
      --correct: #16a34a;
      --correct-bg: #f0fdf4;
      --correct-border: #86efac;
      --wrong: #dc2626;
      --wrong-bg: #fff5f5;
      --wrong-border: #fca5a5;
      --active-bg: #eff4ff;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif;
      min-height: 100vh; display: flex;
      flex-direction: column; align-items: center;
    }

    /* ── Settings ── */
    #settings {
      width: 100%; max-width: 540px;
      padding: 32px 20px 20px;
      display: flex; flex-direction: column; gap: 14px;
    }
    #settings h1 { font-size: 1.15rem; font-weight: 600; color: var(--muted); }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .tag {
      cursor: pointer; padding: 6px 16px; border-radius: 20px;
      border: 1.5px solid var(--border); background: #efefed;
      font-size: .85rem; font-weight: 500; user-select: none; transition: all .15s;
    }
    .tag.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .tag:hover:not(.active) { border-color: var(--accent); color: var(--accent); }
    #start-btn {
      align-self: flex-end; padding: 9px 24px; border-radius: 20px;
      border: none; background: var(--accent); color: #fff;
      font-size: .9rem; font-weight: 600; cursor: pointer;
    }
    #start-btn:hover { opacity: .85; }

    /* ── Quiz ── */
    #quiz { display: none; width: 100%; flex-direction: column; align-items: center; }

    #topbar {
      position: sticky; top: 0; z-index: 10;
      width: 100%; background: var(--bg);
      border-bottom: 1px solid var(--border);
      padding: 10px 20px;
    }
    #topbar-inner {
      width: 100%; max-width: 980px; margin: 0 auto;
      display: flex; align-items: center; gap: 12px;
    }
    #pb-bg { flex: 1; height: 5px; border-radius: 4px; background: var(--border); overflow: hidden; }
    #pb { height: 100%; border-radius: 4px; background: var(--accent); transition: width .2s; }
    #prog-txt { font-size: .78rem; color: var(--muted); white-space: nowrap; }
    .sc-c { font-size: .82rem; font-weight: 700; color: var(--correct); }

    /* 橫向緊密網格：卡片間無縫隙 */
    #qlist {
      width: 100%; max-width: 980px;
      padding: 16px 20px 60px;
      display: flex;
      flex-wrap: wrap;
      gap: 0;
      justify-content: flex-start;
    }

    /* 單個方框卡片：無縫緊貼拼接 */
    .qcard {
      width: 80px;
      padding: 8px 4px 10px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      margin-left: -1.5px;
      margin-top: -1.5px;
      border-radius: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      position: relative;
      cursor: pointer;
      transition: background .15s ease;
      z-index: 1;
    }
    .qcard:hover {
      z-index: 3;
      border-color: #b5cbfb;
    }
    .qcard.active-card {
      border-color: var(--accent);
      background: var(--active-bg);
      z-index: 5;
      box-shadow: 0 0 0 2px var(--accent);
    }
    .qcard.done-correct {
      background: var(--correct-bg);
      border-color: var(--correct-border);
      opacity: 0.7;
    }
    .qcard.has-error {
      border-color: var(--wrong);
      background: var(--wrong-bg);
      z-index: 4;
    }

    .qnum {
      position: absolute;
      top: 4px;
      left: 6px;
      font-size: .65rem;
      color: var(--muted);
      line-height: 1;
    }
    .qkana {
      font-size: 1.85rem;
      line-height: 1.1;
      text-align: center;
      user-select: none;
      margin-top: 4px;
    }
    .qinput {
      width: 60px;
      padding: 4px 6px;
      font-size: .92rem;
      border: 1.5px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      text-align: center;
      outline: none;
      letter-spacing: .04em;
      transition: border-color .1s, background .1s;
    }
    .qinput:focus {
      border-color: var(--accent);
    }
    .qinput.correct {
      border-color: var(--correct);
      background: #fff;
      color: var(--correct);
      font-weight: 700;
    }
    .qinput.wrong {
      border-color: var(--wrong);
      background: #fff;
      color: var(--wrong);
      font-weight: 600;
    }
    .qinput:disabled {
      cursor: default;
    }

    /* ── Result ── */
    #result {
      display: none; flex-direction: column; align-items: center;
      width: 100%; max-width: 540px;
      padding: 40px 20px; gap: 24px;
    }
    #result h2 { font-size: 1.5rem; font-weight: 700; }
    #res-stats { display: flex; gap: 32px; }
    .rstat { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .rstat span:first-child { font-size: 2.2rem; font-weight: 700; }
    .rstat span:last-child  { font-size: .78rem; color: var(--muted); }
    .rstat.c span:first-child { color: var(--correct); }
    .rstat.w span:first-child { color: var(--wrong); }
    #retry-btn {
      padding: 10px 28px; border-radius: 20px; border: none;
      background: var(--accent); color: #fff;
      font-size: .95rem; font-weight: 600; cursor: pointer;
    }
    #retry-btn:hover { opacity: .85; }
  </style>
</head>
<body>

<section id="settings">
  <h1>五十音練習</h1>
  <div class="row">
    <span class="tag active" data-group="script" data-value="hira">平假名</span>
    <span class="tag"        data-group="script" data-value="kata">片假名</span>
  </div>
  <div class="row">
    <span class="tag" data-group="opt" data-value="daku">濁音</span>
    <span class="tag" data-group="opt" data-value="handaku">半濁音</span>
    <span class="tag" data-group="opt" data-value="you">拗音</span>
  </div>
  <button id="start-btn">開始練習</button>
</section>

<section id="quiz">
  <div id="topbar">
    <div id="topbar-inner">
      <div id="pb-bg"><div id="pb" style="width:0%"></div></div>
      <span id="prog-txt">0 / 100</span>
      <span class="sc-c">✓ <span id="sc-c">0</span></span>
    </div>
  </div>
  <div id="qlist"></div>
</section>

<section id="result">
  <h2>練習完成！</h2>
  <div id="res-stats">
    <div class="rstat c"><span id="r-c">0</span><span>題全數完成</span></div>
  </div>
  <button id="retry-btn">再練一次</button>
</section>

<script>
// ── DATA ─────────────────────────────────────
const HIRA_BASIC = [
  {k:'あ',r:['a']},  {k:'い',r:['i']},  {k:'う',r:['u']},  {k:'え',r:['e']},  {k:'お',r:['o']},
  {k:'か',r:['ka']}, {k:'き',r:['ki']}, {k:'く',r:['ku']}, {k:'け',r:['ke']}, {k:'こ',r:['ko']},
  {k:'さ',r:['sa']}, {k:'し',r:['shi','si']}, {k:'す',r:['su']}, {k:'せ',r:['se']}, {k:'そ',r:['so']},
  {k:'た',r:['ta']}, {k:'ち',r:['chi','ti']}, {k:'つ',r:['tsu','tu']}, {k:'て',r:['te']}, {k:'と',r:['to']},
  {k:'な',r:['na']}, {k:'に',r:['ni']}, {k:'ぬ',r:['nu']}, {k:'ね',r:['ne']}, {k:'の',r:['no']},
  {k:'は',r:['ha']}, {k:'ひ',r:['hi']}, {k:'ふ',r:['fu','hu']}, {k:'へ',r:['he']}, {k:'ほ',r:['ho']},
  {k:'ま',r:['ma']}, {k:'み',r:['mi']}, {k:'む',r:['mu']}, {k:'め',r:['me']}, {k:'も',r:['mo']},
  {k:'や',r:['ya']}, {k:'ゆ',r:['yu']}, {k:'よ',r:['yo']},
  {k:'ら',r:['ra']}, {k:'り',r:['ri']}, {k:'る',r:['ru']}, {k:'れ',r:['re']}, {k:'ろ',r:['ro']},
  {k:'わ',r:['wa']}, {k:'を',r:['wo','o']}, {k:'ん',r:['n','nn']},
];
const HIRA_DAKU = [
  {k:'が',r:['ga']}, {k:'ぎ',r:['gi']}, {k:'ぐ',r:['gu']}, {k:'げ',r:['ge']}, {k:'ご',r:['go']},
  {k:'ざ',r:['za']}, {k:'じ',r:['ji','zi']}, {k:'ず',r:['zu']}, {k:'ぜ',r:['ze']}, {k:'ぞ',r:['zo']},
  {k:'だ',r:['da']}, {k:'ぢ',r:['ji','di','zi']}, {k:'づ',r:['zu','du']}, {k:'で',r:['de']}, {k:'ど',r:['do']},
  {k:'ば',r:['ba']}, {k:'び',r:['bi']}, {k:'ぶ',r:['bu']}, {k:'べ',r:['be']}, {k:'ぼ',r:['bo']},
];
const HIRA_HANDAKU = [
  {k:'ぱ',r:['pa']}, {k:'ぴ',r:['pi']}, {k:'ぷ',r:['pu']}, {k:'ぺ',r:['pe']}, {k:'ぽ',r:['po']},
];
const HIRA_YOU_BASIC = [
  {k:'きゃ',r:['kya']}, {k:'きゅ',r:['kyu']}, {k:'きょ',r:['kyo']},
  {k:'しゃ',r:['sha','sya']}, {k:'しゅ',r:['shu','syu']}, {k:'しょ',r:['sho','syo']},
  {k:'ちゃ',r:['cha','tya']}, {k:'ちゅ',r:['chu','tyu']}, {k:'ちょ',r:['cho','tyo']},
  {k:'にゃ',r:['nya']}, {k:'にゅ',r:['nyu']}, {k:'にょ',r:['nyo']},
  {k:'ひゃ',r:['hya']}, {k:'ひゅ',r:['hyu']}, {k:'ひょ',r:['hyo']},
  {k:'みゃ',r:['mya']}, {k:'みゅ',r:['myu']}, {k:'みょ',r:['myo']},
  {k:'りゃ',r:['rya']}, {k:'りゅ',r:['ryu']}, {k:'りょ',r:['ryo']},
];
const HIRA_YOU_DAKU = [
  {k:'ぎゃ',r:['gya']}, {k:'ぎゅ',r:['gyu']}, {k:'ぎょ',r:['gyo']},
  {k:'じゃ',r:['ja','jya','zya']}, {k:'じゅ',r:['ju','jyu','zyu']}, {k:'じょ',r:['jo','jyo','zyo']},
  {k:'びゃ',r:['bya']}, {k:'びゅ',r:['byu']}, {k:'びょ',r:['byo']},
];
const HIRA_YOU_HANDAKU = [
  {k:'ぴゃ',r:['pya']}, {k:'ぴゅ',r:['pyu']}, {k:'ぴょ',r:['pyo']},
];

function toKata(s){ return s.replace(/[\u3041-\u3096]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60)); }
const KATA_BASIC       = HIRA_BASIC.map(x=>({k:toKata(x.k),r:x.r}));
const KATA_DAKU        = HIRA_DAKU.map(x=>({k:toKata(x.k),r:x.r}));
const KATA_HANDAKU     = HIRA_HANDAKU.map(x=>({k:toKata(x.k),r:x.r}));
const KATA_YOU_BASIC   = HIRA_YOU_BASIC.map(x=>({k:toKata(x.k),r:x.r}));
const KATA_YOU_DAKU    = HIRA_YOU_DAKU.map(x=>({k:toKata(x.k),r:x.r}));
const KATA_YOU_HANDAKU = HIRA_YOU_HANDAKU.map(x=>({k:toKata(x.k),r:x.r}));

// ── HELPERS ──────────────────────────────────
function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
const TOTAL = 100;
const cfg = {script:'hira',daku:false,handaku:false,you:false};

function buildPool(){
  const H = cfg.script==='hira';
  let p = [...(H?HIRA_BASIC:KATA_BASIC)];
  if(cfg.daku)    p=p.concat(H?HIRA_DAKU:KATA_DAKU);
  if(cfg.handaku) p=p.concat(H?HIRA_HANDAKU:KATA_HANDAKU);
  if(cfg.you){
    p=p.concat(H?HIRA_YOU_BASIC:KATA_YOU_BASIC);
    if(cfg.daku)    p=p.concat(H?HIRA_YOU_DAKU:KATA_YOU_DAKU);
    if(cfg.handaku) p=p.concat(H?HIRA_YOU_HANDAKU:KATA_YOU_HANDAKU);
  }
  return p;
}

function buildQuestions(pool){
  if(pool.length>=TOTAL) return shuffle([...pool]).slice(0,TOTAL);
  const extra = Math.floor((TOTAL-pool.length)/pool.length);
  const rem   = (TOTAL-pool.length)%pool.length;
  let q = shuffle([...pool]);
  for(let i=0;i<extra;i++) q=q.concat(shuffle([...pool]));
  q=q.concat(shuffle([...pool]).slice(0,rem));
  return shuffle(q);
}

// ── SETTINGS ─────────────────────────────────
document.querySelectorAll('.tag').forEach(t=>{
  t.addEventListener('click',()=>{
    if(t.dataset.group==='script'){
      document.querySelectorAll('[data-group="script"]').forEach(x=>x.classList.remove('active'));
      t.classList.add('active'); cfg.script=t.dataset.value;
    } else {
      t.classList.toggle('active'); cfg[t.dataset.value]=t.classList.contains('active');
    }
  });
});

// ── STATE ────────────────────────────────────
let questions=[], done=0, scoreC=0;
let inputs=[], cards=[], wasWrong=[];
let curIdx=0;

const settEl = document.getElementById('settings');
const quizEl = document.getElementById('quiz');
const resEl  = document.getElementById('result');
const pbEl   = document.getElementById('pb');
const ptEl   = document.getElementById('prog-txt');
const scCEl  = document.getElementById('sc-c');
const qlist  = document.getElementById('qlist');

document.getElementById('start-btn').addEventListener('click', startQuiz);

function startQuiz(){
  const pool = buildPool();
  questions = buildQuestions(pool);
  done=0; scoreC=0; curIdx=0;
  inputs=[]; cards=[]; wasWrong=[];
  qlist.innerHTML='';

  questions.forEach((q,i)=>{
    // 方形框卡片
    const card = document.createElement('div');
    card.className = 'qcard' + (i===0?' active-card':'');

    const num = document.createElement('span');
    num.className='qnum'; num.textContent=i+1;

    const kana = document.createElement('span');
    kana.className='qkana'; kana.textContent=q.k;

    const inp = document.createElement('input');
    inp.type='text'; inp.className='qinput';
    inp.autocomplete='off'; inp.autocorrect='off';
    inp.autocapitalize='off'; inp.spellcheck=false;
    inp.placeholder='?';
    inp.tabIndex = i+1;

    card.appendChild(num);
    card.appendChild(kana);
    card.appendChild(inp);
    qlist.appendChild(card);

    cards.push(card);
    inputs.push(inp);
    wasWrong.push(false);

    // 點擊卡片任何位置聚焦輸入框
    card.addEventListener('click', ()=>{
      if(!inp.disabled) inp.focus();
    });

    inp.addEventListener('input', ()=>onType(i));
    inp.addEventListener('focus', ()=>setActive(i));
  });

  updateTop();
  settEl.style.display='none';
  quizEl.style.display='flex';
  inputs[0].focus();
  cards[0].scrollIntoView({behavior:'smooth',block:'center'});
}

// ── REAL-TIME CHECK ──────────────────────────
function onType(i){
  const inp = inputs[i];
  if(inp.disabled) return;
  const val = inp.value.toLowerCase().trim();
  const q   = questions[i];
  const card = cards[i];

  if(!val){
    inp.className='qinput';
    card.classList.remove('has-error');
    return;
  }

  // 完全符合拼音 → 正確，立刻跳下一題
  if(q.r.includes(val)){
    markCorrect(i);
    return;
  }

  // 如果依然是某個可能拼音的前綴 → 保持普通狀態
  if(q.r.some(a=>a.startsWith(val))){
    inp.className='qinput';
    card.classList.remove('has-error');
    return;
  }

  // 輸入錯誤：輸入框與方框變紅，不顯示答案，可繼續修改
  inp.className='qinput wrong';
  card.classList.add('has-error');
  wasWrong[i]=true;
}

function markCorrect(i){
  const inp  = inputs[i];
  const card = cards[i];

  inp.className='qinput correct';
  inp.disabled=true; // 鎖定已答對的
  card.classList.remove('active-card', 'has-error');
  card.classList.add('done-correct');

  scoreC++;
  done++;
  updateTop();

  if(done===TOTAL){
    setTimeout(showResult, 300);
    return;
  }

  // 答對立即自動跳到下一格
  const next = findNext(i);
  if(next!==-1) {
    activate(next);
  }
}

// 尋找下一個未完成的格子
function findNext(from){
  for(let j=from+1; j<TOTAL; j++) if(!inputs[j].disabled) return j;
  for(let j=0; j<from; j++)        if(!inputs[j].disabled) return j;
  return -1;
}

function activate(i){
  if(i===-1) return;
  setActive(i);
  inputs[i].focus();
  cards[i].scrollIntoView({behavior:'smooth',block:'nearest'});
}

function setActive(i){
  if(inputs[i].disabled) return;
  if(cards[curIdx]) cards[curIdx].classList.remove('active-card');
  curIdx = i;
  cards[i].classList.add('active-card');
}



function updateTop(){
  const pct=done/TOTAL*100;
  pbEl.style.width=pct+'%';
  ptEl.textContent=done+' / '+TOTAL;
  scCEl.textContent=scoreC;
}

// ── RESULT ───────────────────────────────────
function showResult(){
  quizEl.style.display='none'; resEl.style.display='flex';
  document.getElementById('r-c').textContent=scoreC;
}

document.getElementById('retry-btn').addEventListener('click',()=>{
  resEl.style.display='none'; settEl.style.display='flex';
});
</script>
</body>
</html>
